# =============================================================================
# Parameters of the dengue-Wolbachia model (single case: wMel strain).
# Time unit: DAYS throughout the file.
#
# All values marked "PROVISIONAL - replace" are order-of-magnitude figures
# from the general literature on Aedes aegypti and must be replaced
# with values from the user's bibliographic reference before publishing
# any results.
# =============================================================================

mosquito_wild:
  rho_N: 1.25        # PROVISIONAL - replace. Wild per-capita fecundity (day^-1)
  alpha_N: 0.04      # PROVISIONAL - replace. Wild per-capita mortality (half-life ~25 days)
  beta_N: 1.0e-4     # PROVISIONAL - replace. Wild density-dependent competition
  f: 0.5             # Proportion of females at birth, wild

# wMel strain: low fitness cost (the most widely used in the field for
# population replacement, e.g. World Mosquito Program).
mosquito_wolbachia:
  rho_W: 1.15        # PROVISIONAL - replace. Fecundity nearly equal to rho_N
  alpha_W: 0.045     # PROVISIONAL - replace. Mortality just above alpha_N
  beta_W: 1.0e-4     # PROVISIONAL - replace. Same density-dependent competition as wild
  q: 0.5             # Proportion of females at birth, Wolbachia-carrying

human:
  mu_N: 5.0e-5       # PROVISIONAL - replace. Human -> mosquito transmission
  mu_H: 5.0e-5       # PROVISIONAL - replace. Mosquito -> human transmission
  alpha_H: 0.1428    # 1/7 days. Recovery from dengue
  gamma: 0.0055      # PROVISIONAL - replace. ~180 days of temporary immunity
  H: 100000          # Total human population (constant)

numerics:
  method: LSODA      # LSODA or Radau: stiff system (mosquitoes ~days, immunity ~months)
  rtol: 1.0e-8
  atol: 1.0e-10

# Initial condition common to both cases (baseline and control). The
# control case adds the Wolbachia release at t=0 on top of this
# (see scripts/run_baseline_vs_control.py) — not edited here.
initial_conditions:
  N_FS: 10000.0
  N_FI: 10.0
  N_M: 10000.0
  W_F: 0.0
  W_M: 0.0
  S: 99000.0
  I: 1000.0
  R: 0.0
  C: 1000.0          # cumulative incidence; starts equal to I(0) (those 1000 are already "cases")
